/* Layout: one 480px column on grey ground, white rounded sections, fixed bottom tab bar + floating add button */

<script id="logic">
// ---------- pure logic (also run by the test script) ----------
const DEFAULT_SETTINGS = {
  debt: 0, debtAsOf: "", debtStart: 0, rate: 0.0645, limit: 0, maturity: "",
  incomes: [{ id: "alba", name: "알바", amount: 0, day: 13 }, { id: "allow", name: "용돈", amount: 0, day: 30 }, { id: "aid", name: "월세 지원금", amount: 0, day: 25 }],
  raise: { amount: 0, from: "" },
  fixed: [{ name: "월세·관리비", amount: 0, day: 30 }, { name: "교통", amount: 0 }, { name: "가스·전기", amount: 0 }, { name: "통신", amount: 0 }, { name: "AI 구독", amount: 0 }, { name: "데이트 모임통장", amount: 0 }, { name: "여행저축", amount: 0, day: 15, until: "" }],
  cats: [{ id: "food", name: "식비", limit: 0 }, { id: "shop", name: "쇼핑", limit: 0 }, { id: "cafe", name: "카페", limit: 0 }, { id: "hair", name: "헤어컷", limit: 0, lump: true }, { id: "sub", name: "구독", limit: 0, lump: true }],
  emergency: 0,
};
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
const pad2 = n => String(n).padStart(2, "0");
const ymOf = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1);
const isoOf = d => ymOf(d) + "-" + pad2(d.getDate());
function addMonths(key, n) { let [y, m] = key.split("-").map(Number); m += n - 1; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12 + 1; return y + "-" + pad2(m); }
function daysIn(key) { const [y, m] = key.split("-").map(Number); return new Date(y, m, 0).getDate(); }

// Budget view of one month. today = "YYYY-MM-DD".
// Income items (type "in") are one-off money beyond the regular incomes in settings.
// toBudget: added to this month's spending money; otherwise it goes to paying down the overdraft.
function monthStats(S, all, key, today) {
  // Spending in a category that is no longer in the budget (e.g. dating moved to a fixed transfer) is kept as a record only.
  const known = new Set(S.cats.map(c => c.id)), outs = all.filter(i => i.type !== "in");
  const items = outs.filter(i => known.has(i.cat)), ins = all.filter(i => i.type === "in");
  const incomeTotal = sum(ins, i => i.amount), extraBudget = sum(ins.filter(i => i.toBudget), i => i.amount);
  const dim = daysIn(key), cur = today.slice(0, 7);
  const day = key === cur ? +today.slice(8) : key < cur ? dim : 0;
  const elapsed = day / dim, daysLeft = key === cur ? dim - day + 1 : key < cur ? 0 : dim;
  const cats = S.cats.map(c => {
    const spent = sum(items.filter(i => i.cat === c.id), i => i.amount);
    const left = c.limit - spent, ratio = c.limit ? spent / c.limit : spent > 0 ? 2 : 0;
    const status = c.lump ? (spent > 0 && spent >= c.limit ? "paid" : "due") : spent > c.limit ? "over" : ratio > elapsed ? "fast" : "ok";
    return { ...c, spent, left, ratio, status, perDay: daysLeft ? Math.max(0, left) / daysLeft : 0 };
  });
  const other = sum(outs.filter(i => !known.has(i.cat)), i => i.amount);
  const limitTotal = sum(cats, c => c.limit), spentTotal = sum(items, i => i.amount);
  const flexLeft = sum(cats.filter(c => !c.lump), c => c.left) + extraBudget;
  const budgetTotal = limitTotal + extraBudget;
  return { key, dim, day, elapsed, daysLeft, cats, other, limitTotal, budgetTotal, spentTotal, incomeTotal, extraBudget,
    left: budgetTotal - spentTotal, today: daysLeft ? Math.max(0, flexLeft) / daysLeft : 0, flexLeft };
}

// Month-by-month payoff of the overdraft. Mirrors the Excel model:
// interest = start balance × rate/12; payment = min(balance+interest, income − fixed − variable − emergency).
// In the as-of month only income/fixed whose pay day is after the as-of day count (unknown day = month end),
// and spending already dated on or before the as-of day is already inside the balance.
function simulate(S, months, raise) {
  if (!S.debtAsOf || !S.debt) return { rows: [], totalInt: 0, payoff: S.debt ? null : S.debtAsOf.slice(0, 7), atMaturity: 0 };
  const k0 = S.debtAsOf.slice(0, 7), d0 = +S.debtAsOf.slice(8), r = S.rate / 12;
  const limitTotal = sum(S.cats, c => c.limit), known = new Set(S.cats.map(c => c.id));
  let bal = S.debt, totalInt = 0;
  const rows = [];
  for (let i = 0; i < 60 && bal > 0.5; i++) {
    const k = addMonths(k0, i), pend = x => i > 0 || (x.day || 31) > d0;
    let inc = sum(S.incomes.filter(pend), x => x.amount);
    if (raise && S.raise.from && k >= S.raise.from && pend({ day: 13 })) inc += raise;
    const fixed = sum(S.fixed.filter(f => pend(f) && (!f.until || k <= f.until)), f => f.amount);
    const all = months[k] || [], items = all.filter(x => x.type !== "in" && known.has(x.cat)), ins = all.filter(x => x.type === "in");
    inc += sum(ins.filter(x => i > 0 || x.date > S.debtAsOf), x => x.amount); // earlier ones are already in the balance
    let v = Math.max(limitTotal + sum(ins.filter(x => x.toBudget), x => x.amount), sum(items, x => x.amount));
    if (i === 0) v -= sum(items.filter(x => x.date <= S.debtAsOf), x => x.amount);
    const intr = bal * r, pay = Math.min(bal + intr, inc - fixed - v - (S.emergency || 0));
    bal = bal + intr - pay; totalInt += intr;
    rows.push({ k, inc, fixed, v, pay, intr, bal: Math.max(0, bal) });
  }
  const last = rows[rows.length - 1];
  const mk = S.maturity ? S.maturity.slice(0, 7) : "";
  const mrow = rows.find(x => x.k === mk);
  return { rows, totalInt, payoff: last && last.bal <= 0.5 ? last.k : null, atMaturity: mrow ? mrow.bal : 0 };
}
</script>

<script>
// ---------- theme (per-device preference) ----------
const HOST_THEME = document.documentElement.getAttribute("data-theme");
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const LS_KEY = "ledger-data";
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
let themePref = lsGet("ledger-theme") || "system";
function applyTheme() {
  const r = document.documentElement;
  if (themePref !== "system") r.setAttribute("data-theme", themePref);
  else if (HOST_THEME) r.setAttribute("data-theme", HOST_THEME);
  else r.removeAttribute("data-theme");
}
const isDark = () => { const a = document.documentElement.getAttribute("data-theme"); return a ? a === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function setTheme(t) { themePref = t; lsSet("ledger-theme", t); applyTheme(); render(); }
applyTheme();
const themeBtn = () => `<button class="iconbtn" id="themeBtn" aria-label="${isDark() ? "라이트 모드로 바꾸기" : "다크 모드로 바꾸기"}">${isDark()
  ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0-5 1 3h-2l1-3Zm0 20-1-3h2l-1 3ZM2 12l3-1v2l-3-1Zm20 0-3 1v-2l3 1ZM4.9 4.9l2.8 1.4-1.4 1.4-1.4-2.8Zm14.2 14.2-2.8-1.4 1.4-1.4 1.4 2.8Zm0-14.2-1.4 2.8-1.4-1.4 2.8-1.4ZM4.9 19.1l1.4-2.8 1.4 1.4-2.8 1.4Z"/></svg>`
  : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>`}</button>`;

// ---------- state ----------
const CAT_COLOR = { food: "var(--c-food)", shop: "var(--c-shop)", date: "var(--c-date)", cafe: "var(--c-cafe)", hair: "var(--c-hair)", sub: "var(--c-sub)" };
const KEYWORDS = [["cafe", /커피|카페|스타벅스|메가|빽다방|컴포즈|이디야|투썸/], ["hair", /미용|헤어|커트|컷/], ["sub", /구독|스포티파이|넷플릭스|유튜브/], ["shop", /쿠팡|무신사|올리브영|다이소|쇼핑/], ["food", /편의점|치킨|밥|식당|마트|배달|도시락|물/]];
const st = { settings: structuredClone(DEFAULT_SETTINGS), months: {}, hasSettings: false, loading: true, offline: false, error: "", tab: "home", logMonth: null, planRaise: null, planView: "A", db: null };
let sheet = null, toastTimer = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = n => Math.round(n).toLocaleString("ko-KR") + "원";
const manwon = n => { const v = Math.round(n / 10000); return v.toLocaleString("ko-KR") + "만"; };
const todayIso = () => isoOf(new Date());
const ymLabel = k => { const [y, m] = k.split("-"); return `${y}년 ${+m}월`; };
const catOf = id => st.settings.cats.find(c => c.id === id);
const INCOME_CATS = [{ id: "in_allow", name: "용돈" }, { id: "in_alba", name: "알바" }, { id: "in_etc", name: "기타 수입" }];
const catColor = id => CAT_COLOR[id] || (id?.startsWith("in_") ? "var(--blue-strong)" : "var(--c-etc)");
const OLD_CATS = { date: "데이트" }; // categories removed from the budget; old records keep their name
const catName = id => catOf(id)?.name || INCOME_CATS.find(c => c.id === id)?.name || OLD_CATS[id] || "기타";
const allItems = () => Object.values(st.months).flat();

// ---------- storage (db capability, owner-only) ----------
const writeChains = {};
function save(docId, body) {
  if (!st.db) { // no Claude storage here: keep everything on this device
    if (!lsSet(LS_KEY, JSON.stringify({ settings: st.settings, months: st.months }))) showToast("이 기기에 저장하지 못했어요. 백업을 복사해 두세요");
    return Promise.resolve();
  }
  const run = () => st.db.doc("ledger/" + docId).set(body).catch(e => { showToast(e.code === "quota_exceeded" ? "저장 공간이 가득 찼어요" : "저장하지 못했어요. 다시 시도해 주세요"); });
  writeChains[docId] = (writeChains[docId] || Promise.resolve()).then(run);
  return writeChains[docId];
}
const saveSettings = () => { st.hasSettings = true; return save("settings", st.settings); };
const saveMonth = k => save("m-" + k, { items: st.months[k] || [] });

async function boot() {
  render();
  const db = await (window.claude?.use ? window.claude.use("db") : Promise.resolve(null)).catch(() => null);
  if (!db) {
    st.loading = false; st.offline = true;
    try {
      const saved = JSON.parse(lsGet(LS_KEY) || "null");
      if (saved?.settings) { st.settings = { ...structuredClone(DEFAULT_SETTINGS), ...saved.settings }; st.hasSettings = true; }
      if (saved?.months) st.months = saved.months;
    } catch {}
    navigator.storage?.persist?.().catch(() => {});
    render(); return;
  }
  st.db = db;
  const timer = setTimeout(() => { if (st.loading) { st.error = "저장된 기록을 아직 불러오지 못했어요. 잠시 후 다시 열어 주세요."; st.loading = false; render(); } }, 10000);
  db.collection("ledger").onSnapshot(snap => {
    const months = {}; let settings = null;
    for (const d of snap.docs) {
      if (d.id === "settings") settings = d.data();
      else if (d.id.startsWith("m-")) months[d.id.slice(2)] = (d.data().items || []).slice();
    }
    if (settings) { st.settings = { ...structuredClone(DEFAULT_SETTINGS), ...structuredClone(settings) }; st.hasSettings = true; }
    st.months = months;
    if (!snap.metadata.fromCache) { clearTimeout(timer); st.loading = false; st.error = ""; }
    render();
  }, e => { clearTimeout(timer); st.loading = false; st.error = e.code === "revoked" ? "" : "기록을 불러오지 못했어요."; render(); });
}

// ---------- charts ----------
function ringSvg(ms) {
  const R = 60, C = 2 * Math.PI * R, total = Math.max(ms.budgetTotal, ms.spentTotal) || 1;
  let off = 0, arcs = "";
  const parts = ms.cats.filter(c => c.spent > 0).map(c => [c.id, c.spent]);
  for (const [id, v] of parts) {
    const len = (v / total) * C;
    arcs += `<circle cx="74" cy="74" r="${R}" fill="none" stroke="${catColor(id)}" stroke-width="16" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 74 74)"/>`;
    off += len;
  }
  const pct = ms.budgetTotal ? Math.max(0, ms.left) / ms.budgetTotal : 0;
  return `<svg class="ring" viewBox="0 0 148 148" role="img" aria-label="이번 달 쓸 수 있는 돈 ${won(ms.budgetTotal)} 중 ${won(ms.spentTotal)} 사용">
    <circle cx="74" cy="74" r="${R}" fill="none" stroke="var(--sunken)" stroke-width="16"/>${arcs}
    <text x="74" y="70" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--fg3)">남은 한도</text>
    <text x="74" y="92" text-anchor="middle" font-size="22" font-weight="800">${Math.round(pct * 100)}%</text></svg>`;
}

function lineSvg(series, limit, opts = {}) {
  const W = 320, H = opts.h || 150, L = 34, Rt = 8, T = 10, B = 22;
  const n = Math.max(...series.map(s => s.pts.length), 2);
  const maxV = Math.max(limit || 0, ...series.flatMap(s => s.pts.map(p => p.v)), 1);
  const x = i => L + (i / (n - 1)) * (W - L - Rt), y = v => T + (1 - v / maxV) * (H - T - B);
  let g = "";
  const step = maxV > 2e6 ? 1e6 : 5e5;
  for (let v = 0; v <= maxV; v += step) g += `<line class="grid" x1="${L}" x2="${W - Rt}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v ? manwon(v) : "0"}</text>`;
  if (limit) g += `<line x1="${L}" x2="${W - Rt}" y1="${y(limit)}" y2="${y(limit)}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W - Rt}" y="${y(limit) + 12}" text-anchor="end" style="fill:var(--red)">한도 ${manwon(limit)}</text>`;
  const labels = series[0].pts;
  const idx = [0, Math.floor((labels.length - 1) / 2), labels.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  for (const i of idx) if (labels[i]) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === labels.length - 1 ? "end" : "middle"}">${labels[i].k.slice(2).replace("-", ".")}</text>`;
  for (const s of series) {
    if (!s.pts.length) continue;
    const d = s.pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    if (s.fill) g += `<path d="${d}L${x(s.pts.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.color}" opacity=".08"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lp = s.pts.length - 1;
    g += `<circle cx="${x(lp)}" cy="${y(s.pts[lp].v)}" r="4" fill="${s.color}"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "빚 잔액 추이")}">${g}</svg>`;
}
const balPts = sim => sim.rows.length ? [{ k: st.settings.debtAsOf.slice(0, 7), v: st.settings.debt }, ...sim.rows.map(r => ({ k: r.k, v: r.bal }))] : [];

// ---------- views ----------
const STATUS_TEXT = { ok: ["b-ok", "여유 있어요"], fast: ["b-fast", "빨리 쓰고 있어요"], over: ["b-over", "한도를 넘었어요"], paid: ["b-paid", "결제했어요"], due: ["b-due", "결제 전이에요"] };
const badge = s => `<span class="badge ${STATUS_TEXT[s][0]}">${STATUS_TEXT[s][1]}</span>`;

function homeView() {
  const today = todayIso(), key = today.slice(0, 7), S = st.settings;
  const ms = monthStats(S, st.months[key] || [], key, today);
  const totalStatus = ms.flexLeft < 0 ? "over" : ms.cats.some(c => c.status === "over") ? "over" : (ms.spentTotal / (ms.budgetTotal || 1)) > ms.elapsed ? "fast" : "ok";
  const simA = simulate(S, st.months, 0), simB = simulate(S, st.months, S.raise.amount);
  const legend = ms.cats.filter(c => c.spent > 0).map(c => `<div class="li"><span class="dot" style="background:${catColor(c.id)}"></span><span>${esc(c.name)}</span><span class="num">${won(c.spent)}</span></div>`).join("") + (ms.other ? `<div class="li"><span class="dot" style="background:var(--c-etc)"></span><span>예산 밖 기록</span><span class="num">${won(ms.other)}</span></div>` : "") || `<div class="muted">아직 쓴 돈이 없어요</div>`;
  const catRows = ms.cats.map(c => {
    const pct = Math.min(1, c.limit ? c.spent / c.limit : 0);
    const color = c.lump ? (c.status === "paid" ? "var(--green)" : "var(--fg4)") : c.status === "over" ? "var(--red)" : c.status === "fast" ? "var(--orange)" : catColor(c.id);
    const meta = c.lump ? `${won(c.limit)} 중 ${won(c.spent)} 냈어요` : `${won(c.limit)} 중 ${won(c.spent)} 썼어요`;
    const right = c.lump ? (c.status === "paid" ? "완료" : won(c.left)) : (c.left < 0 ? `${won(-c.left)} 초과` : won(c.left));
    return `<div class="cat">
      <div class="row"><span class="icon" style="background:${catColor(c.id)}">${esc(c.name[0])}</span>
        <div style="flex:1;min-width:0"><div class="name">${esc(c.name)}</div><div class="muted">${c.lump ? "한 번에 나가는 돈" : c.status === "over" ? "다른 항목에서 아껴야 해요" : `하루 ${won(c.perDay)}까지`}</div></div>
        <div><div class="amt num" style="${c.left < 0 ? "color:var(--red)" : ""}">${right}</div><div style="text-align:right;margin-top:2px">${badge(c.status)}</div></div></div>
      <div class="bar" aria-hidden="true"><i style="width:${pct * 100}%;background:${color}"></i>${c.lump || ms.daysLeft === 0 ? "" : `<em style="left:calc(${ms.elapsed * 100}% - 1px)"></em>`}</div>
      <div class="catmeta num"><span>${meta}</span><span>${Math.round((c.limit ? c.spent / c.limit : 0) * 100)}%</span></div></div>`;
  }).join("");
  const payText = sim => sim.payoff ? ymLabel(sim.payoff) : "계산할 수 없어요";
  const debtCard = S.debt ? `<section class="card">
      <div class="spread"><div class="label">마이너스 통장</div><span class="muted">${esc(S.debtAsOf.slice(5).replace("-", "/"))} 기준</span></div>
      <div><div class="big num">${won(S.debt)}</div><div class="muted num" style="margin-top:4px">한도 ${won(S.limit)} · 여유 ${won(S.limit - S.debt)}</div></div>
      ${lineSvg([{ pts: balPts(simA), color: "var(--blue)", fill: true }, { pts: balPts(simB), color: "var(--green)" }], S.limit)}
      <div class="duo"><div class="tile"><span class="muted"><span class="dot" style="display:inline-block;background:var(--blue)"></span> 지금 그대로</span><b class="num">${payText(simA)}</b><span class="muted">에 다 갚아요</span></div>
        <div class="tile"><span class="muted"><span class="dot" style="display:inline-block;background:var(--green)"></span> 알바 +${manwon(S.raise.amount)}원</span><b class="num">${payText(simB)}</b><span class="muted">에 다 갚아요</span></div></div>
    </section>` : "";
  return `
    <header class="top"><div><h1>${+key.slice(5)}월 가계부</h1><span class="sub">${ms.daysLeft}일 남았어요</span></div>${themeBtn()}</header>
    ${statusNotices()}
    <section class="card hero">
      <div class="spread"><div class="label">오늘 쓸 수 있는 돈</div>${badge(totalStatus)}</div>
      <div class="big num">${won(ms.today)}</div>
      <div class="ringwrap">${ringSvg(ms)}<div class="legend">${legend}</div></div>
      <div class="stats num"><div><span class="muted">남은 돈</span><b style="${ms.left < 0 ? "color:var(--red)" : ""}">${won(ms.left)}</b></div><div><span class="muted">쓴 돈</span><b>${won(ms.spentTotal)}</b></div><div><span class="muted">${ms.extraBudget ? "한도+수입" : "한도"}</span><b>${won(ms.budgetTotal)}</b></div></div>
      ${ms.incomeTotal ? `<div class="spread"><span class="muted">이번 달 더 들어온 돈</span><span class="num" style="font-weight:700;color:var(--blue)">+${won(ms.incomeTotal)}</span></div>
      <div class="muted num" style="margin-top:-8px">생활비에 ${won(ms.extraBudget)} · 빚 갚기에 ${won(ms.incomeTotal - ms.extraBudget)}</div>` : ""}
    </section>
    <section class="card"><div class="spread"><div class="label">카테고리별 남은 돈</div><span class="muted">세로선은 오늘이에요</span></div>${catRows}</section>
    ${debtCard}`;
}

function statusNotices() {
  if (st.loading) return `<div class="notice">기록을 불러오고 있어요</div>`;
  if (st.error) return `<div class="notice">${esc(st.error)}</div>`;
  if (!st.hasSettings) return `<div class="notice">${st.offline ? "기록은 이 기기에 저장돼요. 설정 탭의 백업 붙여넣기로 기존 기록을 옮겨 오거나, " : "설정 탭에서 "}수입과 카테고리 한도를 먼저 입력해 주세요.</div>`;
  return "";
}

function logView() {
  const cur = todayIso().slice(0, 7);
  const keys = [...new Set([...Object.keys(st.months), cur])].sort();
  const k = st.logMonth && keys.includes(st.logMonth) ? st.logMonth : cur;
  const i = keys.indexOf(k);
  const items = (st.months[k] || []).slice().sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  const byDay = {};
  for (const it of items) (byDay[it.date] ||= []).push(it);
  const WD = "일월화수목금토";
  const body = Object.entries(byDay).map(([d, arr]) => {
    const dt = new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8));
    const out = sum(arr.filter(x => x.type !== "in"), x => x.amount), inn = sum(arr.filter(x => x.type === "in"), x => x.amount);
    return `<div class="dayhead num"><span>${+d.slice(8)}일 ${WD[dt.getDay()]}요일</span><span>${[inn ? `+${won(inn)}` : "", out ? `-${won(out)}` : ""].filter(Boolean).join(" · ")}</span></div>` +
      arr.map(it => { const isIn = it.type === "in"; return `<button class="li-row" data-edit="${esc(it.id)}" data-month="${k}"><span class="icon" style="background:${catColor(it.cat)}">${esc(catName(it.cat)[0])}</span><span class="t"><div>${esc(it.memo || catName(it.cat))}</div><div class="muted">${esc(catName(it.cat))}${isIn ? (it.toBudget ? " · 생활비" : " · 빚 갚기") : ""}</div></span><span class="v num" style="${isIn ? "color:var(--blue)" : ""}">${isIn ? "+" : "-"}${won(it.amount)}</span></button>`; }).join("");
  }).join("") || `<div class="muted" style="padding:24px 0;text-align:center">이 달에는 기록이 없어요. 아래 지출 버튼으로 추가해 보세요.</div>`;
  return `<header class="top"><h1>기록</h1></header>${statusNotices()}
    <section class="card">
      <div class="monthnav"><button data-month-nav="${keys[i - 1] || ""}" ${i > 0 ? "" : "disabled"} aria-label="이전 달">‹</button><span class="mid">${ymLabel(k)}</span><button data-month-nav="${keys[i + 1] || ""}" ${i < keys.length - 1 ? "" : "disabled"} aria-label="다음 달">›</button></div>
      <div class="duo"><div class="tile" style="text-align:center"><span class="muted">쓴 돈</span><b class="num">${won(sum(items.filter(x => x.type !== "in"), x => x.amount))}</b></div>
        <div class="tile" style="text-align:center"><span class="muted">더 들어온 돈</span><b class="num" style="color:var(--blue)">${won(sum(items.filter(x => x.type === "in"), x => x.amount))}</b></div></div>
      <div class="list">${body}</div></section>`;
}

function planView() {
  const S = st.settings, raise = st.planRaise ?? S.raise.amount;
  const A = simulate(S, st.months, 0), B = simulate(S, st.months, raise);
  const sel = st.planView === "B" ? B : A;
  if (!S.debt) return `<header class="top"><h1>상환 플랜</h1></header>${statusNotices()}<section class="card"><div class="muted">설정에서 마이너스 통장 잔액을 입력하면 상환 계획을 보여드려요.</div></section>`;
  const tile = (name, sim) => `<div class="tile"><span class="muted">${name}</span><b class="num">${sim.payoff ? ymLabel(sim.payoff) : "5년 넘게 걸려요"}</b><span class="muted num">이자 ${won(sim.totalInt)}</span><span class="muted num">만기달 잔액 ${won(sim.atMaturity)}</span></div>`;
  const rows = sel.rows.map(r => `<tr class="num"><td>${r.k.slice(2).replace("-", ".")}</td><td>${won(r.pay)}</td><td>${won(r.intr)}</td><td>${won(r.bal)}</td></tr>`).join("");
  return `<header class="top"><h1>상환 플랜</h1><span class="sub">연 ${(S.rate * 100).toFixed(2)}%</span></header>${statusNotices()}
    <section class="card">
      <div class="label">알바를 더 하면</div>
      <div class="spread"><span class="mid num" id="raiseLabel">+${won(raise)}</span><span class="muted">${S.raise.from ? ymLabel(S.raise.from) + "부터" : ""}</span></div>
      <input type="range" id="raise" min="0" max="400000" step="10000" value="${raise}" aria-label="알바 증액">
      <div class="duo">${tile("지금 그대로", A)}${tile("알바 +" + manwon(raise) + "원", B)}</div>
      ${lineSvg([{ pts: balPts(A), color: "var(--blue)", fill: true }, { pts: balPts(B), color: "var(--green)" }], S.limit, { h: 170 })}
      ${raise !== S.raise.amount ? `<button class="btn ghost" id="saveRaise">이 금액을 기본값으로 저장하기</button>` : ""}
    </section>
    <section class="card">
      <div class="seg" role="group" aria-label="시나리오"><button data-pv="A" aria-pressed="${st.planView !== "B"}">지금 그대로</button><button data-pv="B" aria-pressed="${st.planView === "B"}">알바 +${manwon(raise)}원</button></div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>월</th><th>갚는 돈</th><th>이자</th><th>남은 빚</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="muted">이자는 월초 잔액 × 금리 ÷ 12로 계산한 근사값이에요.</div>
    </section>`;
}

const FIELD_DEFS = () => {
  const S = st.settings;
  return [
    ["마이너스 통장", [
      ["debt", "지금 잔액 (오늘 기준으로 맞추기)", won(S.debt), "money"], ["limit", "한도", won(S.limit), "money"],
      ["rate", "연 금리", (S.rate * 100).toFixed(2) + "%", "rate"], ["maturity", "만기일", S.maturity || "입력 전", "date"]]],
    ["매달 들어오는 돈", S.incomes.map((x, i) => [`incomes.${i}.amount`, `${x.name}${x.day ? ` (${x.day}일)` : ""}`, won(x.amount), "money"])
      .concat([["raise.amount", "알바 증액 계획", won(S.raise.amount), "money"], ["raise.from", "증액 시작 달", S.raise.from ? ymLabel(S.raise.from) : "입력 전", "month"]])],
    ["매달 나가는 돈", S.fixed.map((x, i) => [`fixed.${i}.amount`, `${x.name}${x.until ? ` (~${ymLabel(x.until)})` : ""}`, won(x.amount), "money"])
      .concat(S.fixed.some(f => "until" in f) ? [[`fixed.${S.fixed.findIndex(f => "until" in f)}.until`, "여행저축 끝나는 달", S.fixed.find(f => "until" in f).until ? ymLabel(S.fixed.find(f => "until" in f).until) : "입력 전", "month"]] : [])],
    ["카테고리 한도", S.cats.map((c, i) => [`cats.${i}.limit`, c.name + (c.lump ? " (한 번에)" : ""), won(c.limit), "money"])
      .concat([["emergency", "비상금 적립", won(S.emergency), "money"]])],
  ];
};
function setView() {
  const secs = FIELD_DEFS().map(([title, rows]) => `<section class="card"><div class="sechead">${title}</div><div class="list">${rows.map(([path, label, val]) =>
    `<button class="li-row" data-field="${path}"><span class="t"><div>${esc(label)}</div></span><span class="v num">${esc(val)}</span><span class="chev">›</span></button>`).join("")}</div></section>`).join("");
  const themeSec = `<section class="card"><div class="sechead">화면</div><div class="seg three" role="group" aria-label="화면 모드">${[["system", "시스템"], ["light", "라이트"], ["dark", "다크"]]
    .map(([v, l]) => `<button data-theme-pick="${v}" aria-pressed="${themePref === v}">${l}</button>`).join("")}</div></section>`;
  return `<header class="top"><h1>설정</h1>${themeBtn()}</header>${statusNotices()}${themeSec}${secs}
    <section class="card"><div class="sechead">백업</div>
      <div class="btns" style="grid-template-columns:1fr 1fr"><button class="btn ghost" id="exp">백업 복사하기</button><button class="btn ghost" id="imp">백업 붙여넣기</button></div>
      <div class="muted">${st.offline ? "기록은 이 기기 안에만 있어요. 앱을 지우면 함께 사라지니 일주일에 한 번은 백업을 복사해 메모 앱에 붙여 두세요." : "기록은 이 페이지의 저장소에 남아요. 가끔 백업을 복사해 메모 앱에 붙여 두세요."}</div></section>`;
}

function render() {
  const v = { home: homeView, log: logView, plan: planView, set: setView }[st.tab];
  $("#app").innerHTML = v();
  for (const b of document.querySelectorAll("#tabs button")) b.dataset.tab === st.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current");
  $("#fab").hidden = st.tab === "set";
}

// ---------- sheets ----------
function openSheet(html, onMount) {
  const root = $("#sheetroot");
  root.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  onMount && onMount(root.querySelector(".sheet"));
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add("open")));
}
function closeSheet() { const root = $("#sheetroot"); root.classList.remove("open"); sheet = null; setTimeout(() => { if (!root.classList.contains("open")) root.innerHTML = ""; }, 300); }

const PAD = `<div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "00", 0, "⌫"].map(k => `<button data-key="${k}" aria-label="${k === "⌫" ? "지우기" : k}">${k}</button>`).join("")}</div>`;
function padPress(cur, k) { if (k === "⌫") return cur.slice(0, -1); const n = (cur + k).replace(/^0+/, ""); return n.length > 9 ? cur : n; }

function guessCat(memo) {
  const m = memo.trim().toLowerCase();
  if (!m) return null;
  const hist = allItems().filter(i => i.type !== "in" && (i.memo || "").trim().toLowerCase() === m).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0];
  if (hist && catOf(hist.cat)) return hist.cat;
  const kw = KEYWORDS.find(([, re]) => re.test(m));
  return kw && catOf(kw[0]) ? kw[0] : null;
}
function recents(type) {
  const seen = new Set(), out = [];
  for (const i of allItems().filter(i => (i.type === "in") === (type === "in")).sort((a, b) => (b.ts || 0) - (a.ts || 0))) {
    const key = (i.memo || "") + "|" + i.amount;
    if (!i.memo || seen.has(key)) continue;
    seen.add(key); out.push(i); if (out.length >= 4) break;
  }
  return out;
}

function openEntry(existing) {
  sheet = { type: existing?.type === "in" ? "in" : "out", amount: existing ? String(existing.amount) : "", cat: existing?.cat || null, catTouched: !!existing,
    memo: existing?.memo || "", date: existing?.date || todayIso(), toBudget: !!existing?.toBudget, existing, rec: [] };
  openSheet(`
    ${existing ? "" : `<div class="seg" role="group" aria-label="종류"><button data-type="out">지출</button><button data-type="in">수입</button></div>`}
    <h2 id="etitle"></h2>
    <div class="amount num" id="amt"></div>
    <div class="chips" id="recents"></div>
    <div class="chips" id="catchips"></div>
    <div id="dest" hidden style="display:grid;gap:8px"><div class="muted">이 돈은 어디에 쓸까요?</div>
      <div class="seg" role="group" aria-label="쓰임"><button data-dest="debt">빚 갚기</button><button data-dest="budget">이번 달 생활비</button></div>
      <div class="muted">설정에 있는 정기 수입(알바비·용돈·월세 지원금)은 기록하지 않아도 돼요. 예상 밖으로 들어온 돈만 기록해 주세요.</div></div>
    <div class="fieldrow"><input class="field" id="memo" value="${esc(sheet.memo)}" autocomplete="off" enterkeyhint="done"><input class="field" id="date" type="date" value="${sheet.date}" aria-label="날짜"></div>
    ${PAD}
    <div class="btns" style="${existing ? "" : "grid-template-columns:1fr"}">${existing ? `<button class="btn danger" id="del">삭제</button>` : ""}<button class="btn" id="ok"></button></div>`,
    el => {
      el.addEventListener("click", e => {
        const t = e.target.closest("button"); if (!t) return;
        if (t.dataset.key !== undefined) sheet.amount = padPress(sheet.amount, t.dataset.key);
        else if (t.dataset.type) { if (sheet.type !== t.dataset.type) Object.assign(sheet, { type: t.dataset.type, cat: null, catTouched: false }); }
        else if (t.dataset.dest) sheet.toBudget = t.dataset.dest === "budget";
        else if (t.dataset.cat) { sheet.cat = t.dataset.cat; sheet.catTouched = true; }
        else if (t.dataset.recent) { const r = sheet.rec[+t.dataset.recent]; Object.assign(sheet, { amount: String(r.amount), cat: r.cat, memo: r.memo, toBudget: !!r.toBudget, catTouched: true }); el.querySelector("#memo").value = r.memo; }
        else if (t.id === "ok") return commitEntry();
        else if (t.id === "del") return deleteEntry(sheet.existing);
        paintEntry();
      });
      el.querySelector("#memo").addEventListener("input", e => { sheet.memo = e.target.value; if (!sheet.catTouched && sheet.type === "out") { sheet.cat = guessCat(sheet.memo); paintEntry(); } });
      el.querySelector("#date").addEventListener("change", e => { sheet.date = e.target.value || todayIso(); });
      paintEntry();
    });
}
function paintEntry() {
  const a = $("#amt"); if (!a) return;
  const isIn = sheet.type === "in", ex = sheet.existing;
  $("#etitle").textContent = ex ? (isIn ? "수입 고치기" : "지출 고치기") : isIn ? "얼마 들어왔어요?" : "얼마 썼어요?";
  a.textContent = sheet.amount ? won(+sheet.amount) : "금액을 입력해 주세요";
  a.classList.toggle("empty", !sheet.amount);
  for (const b of document.querySelectorAll("[data-type]")) b.setAttribute("aria-pressed", b.dataset.type === sheet.type);
  for (const b of document.querySelectorAll("[data-dest]")) b.setAttribute("aria-pressed", (b.dataset.dest === "budget") === sheet.toBudget);
  $("#dest").hidden = !isIn;
  sheet.rec = ex ? [] : recents(sheet.type);
  $("#recents").innerHTML = sheet.rec.map((r, i) => `<button class="chip recent" data-recent="${i}">${esc(r.memo)} ${won(r.amount)}</button>`).join("");
  $("#catchips").innerHTML = (isIn ? INCOME_CATS : st.settings.cats).map(c => `<button class="chip" data-cat="${c.id}" aria-pressed="${c.id === sheet.cat}"><span class="dot" style="background:${catColor(c.id)}"></span>${esc(c.name)}</button>`).join("");
  $("#memo").placeholder = isIn ? "어디서 들어왔어요? (선택)" : "어디에 썼어요? (선택)";
  const ok = $("#ok");
  ok.textContent = ex ? "저장하기" : "추가하기";
  ok.disabled = !(+sheet.amount > 0 && sheet.cat);
}
async function commitEntry() {
  const { existing } = sheet, k = sheet.date.slice(0, 7), isIn = sheet.type === "in";
  const item = { id: existing?.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6)), date: sheet.date, amount: +sheet.amount, cat: sheet.cat, memo: sheet.memo.trim(), ts: existing?.ts || Date.now() };
  if (isIn) Object.assign(item, { type: "in", toBudget: sheet.toBudget });
  const before = structuredClone(st.months);
  if (existing) { const ok = existing.date.slice(0, 7); st.months[ok] = (st.months[ok] || []).filter(i => i.id !== existing.id); if (ok !== k) saveMonth(ok); }
  (st.months[k] ||= []).push(item);
  closeSheet(); render(); saveMonth(k);
  const msg = existing ? "고쳤어요" : isIn ? `${won(item.amount)}을 ${item.toBudget ? "생활비에 더했어요" : "빚 갚기에 반영했어요"}` : `${catName(item.cat)}에 ${won(item.amount)} 추가했어요`;
  showToast(msg, () => restore(before));
}
function deleteEntry(it) {
  const before = structuredClone(st.months), k = it.date.slice(0, 7);
  st.months[k] = (st.months[k] || []).filter(i => i.id !== it.id);
  closeSheet(); render(); saveMonth(k);
  showToast("삭제했어요", () => restore(before));
}
function restore(before) {
  const keys = new Set([...Object.keys(before), ...Object.keys(st.months)]);
  st.months = before; render();
  for (const k of keys) saveMonth(k);
}

function getPath(path) { return path.split(".").reduce((o, p) => o?.[p], st.settings); }
function setPath(path, val) { const ps = path.split("."); const last = ps.pop(); ps.reduce((o, p) => o[p], st.settings)[last] = val; }
function openField(path) {
  const def = FIELD_DEFS().flatMap(s => s[1]).find(r => r[0] === path); if (!def) return;
  const [, label, , type] = def, cur = getPath(path);
  if (type === "money") {
    sheet = { amount: cur ? String(Math.round(cur)) : "" };
    openSheet(`<h2>${esc(label)}</h2><div class="amount num" id="amt"></div>${path === "debt" ? `<div class="muted">은행 앱에 보이는 마이너스 통장 잔액을 그대로 넣어 주세요. 오늘 날짜 기준으로 상환 계획을 다시 계산해요.</div>` : ""}${PAD}<button class="btn" id="ok">저장하기</button>`, el => {
      const paint = () => { const a = el.querySelector("#amt"); a.textContent = won(+sheet.amount || 0); };
      el.addEventListener("click", e => { const t = e.target.closest("button"); if (!t) return;
        if (t.dataset.key !== undefined) { sheet.amount = padPress(sheet.amount, t.dataset.key); paint(); }
        if (t.id === "ok") { setPath(path, +sheet.amount || 0); if (path === "debt") { st.settings.debtAsOf = todayIso(); if (!st.settings.debtStart) st.settings.debtStart = st.settings.debt; } closeSheet(); render(); saveSettings(); showToast("저장했어요"); } });
      paint();
    });
    return;
  }
  const inputType = type === "rate" ? "text" : type;
  const val = type === "rate" ? (cur * 100).toFixed(2) : (cur || "");
  openSheet(`<h2>${esc(label)}</h2><input class="field" id="fv" type="${inputType}" ${type === "rate" ? 'inputmode="decimal"' : ""} value="${esc(val)}" aria-label="${esc(label)}">${type === "rate" ? `<div class="muted">퍼센트 숫자만 넣어 주세요. 예: 6.45</div>` : ""}<div class="muted" id="ferr" hidden></div><button class="btn" id="ok">저장하기</button>`, el => {
    el.querySelector("#ok").addEventListener("click", () => {
      const raw = el.querySelector("#fv").value.trim();
      let v = raw;
      if (type === "rate") { v = parseFloat(raw.replace(",", ".")) / 100; if (!(v >= 0 && v < 1)) { const er = el.querySelector("#ferr"); er.hidden = false; er.textContent = "0에서 100 사이 숫자로 넣어 주세요"; return; } }
      setPath(path, v); closeSheet(); render(); saveSettings(); showToast("저장했어요");
    });
  });
}

function openImport() {
  openSheet(`<h2>백업 붙여넣기</h2><textarea class="field" id="bk" placeholder="복사해 둔 백업 내용을 붙여 넣어 주세요"></textarea><div class="muted" id="berr" hidden></div><button class="btn" id="ok">이 백업으로 되돌리기</button>`, el => {
    el.querySelector("#ok").addEventListener("click", async () => {
      try {
        const data = JSON.parse(el.querySelector("#bk").value);
        if (!data.settings || !data.months) throw 0;
        st.settings = { ...structuredClone(DEFAULT_SETTINGS), ...data.settings }; st.months = data.months;
        closeSheet(); render(); saveSettings(); for (const k of Object.keys(data.months)) saveMonth(k);
        showToast("백업을 불러왔어요");
      } catch { const er = el.querySelector("#berr"); er.hidden = false; er.textContent = "백업 형식이 맞지 않아요. 복사한 내용을 전부 붙여 넣었는지 확인해 주세요."; }
    });
  });
}
async function doExport() {
  const text = JSON.stringify({ settings: st.settings, months: st.months });
  try { await navigator.clipboard.writeText(text); showToast("백업을 복사했어요"); }
  catch { openSheet(`<h2>백업 내용</h2><div class="muted">아래 내용을 길게 눌러 전체 선택한 뒤 복사해 주세요.</div><textarea class="field" readonly>${esc(text)}</textarea><button class="btn" data-close>닫기</button>`, el => el.querySelector("textarea").select()); }
}

function showToast(msg, undo) {
  clearTimeout(toastTimer);
  $("#toastroot").innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? `<button id="undo">되돌리기</button>` : ""}</div>`;
  if (undo) $("#undo").onclick = () => { $("#toastroot").innerHTML = ""; undo(); };
  toastTimer = setTimeout(() => { $("#toastroot").innerHTML = ""; }, 4000);
}

// ---------- events ----------
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; st.tab = b.dataset.tab; render(); scrollTo(0, 0); });
$("#fab").addEventListener("click", () => openEntry());
$("#sheetroot").addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheetroot").innerHTML) closeSheet(); });
$("#app").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.edit) { const it = (st.months[t.dataset.month] || []).find(i => i.id === t.dataset.edit); if (it) openEntry(it); }
  else if (t.dataset.monthNav) { st.logMonth = t.dataset.monthNav; render(); }
  else if (t.dataset.pv) { st.planView = t.dataset.pv; render(); }
  else if (t.dataset.field) openField(t.dataset.field);
  else if (t.id === "saveRaise") { st.settings.raise.amount = st.planRaise; saveSettings(); render(); showToast("저장했어요"); }
  else if (t.id === "exp") doExport();
  else if (t.id === "imp") openImport();
  else if (t.id === "themeBtn") setTheme(isDark() ? "light" : "dark");
  else if (t.dataset.themePick) setTheme(t.dataset.themePick);
});
// Update only the label while dragging (re-rendering would replace the slider mid-drag); redraw on release.
$("#app").addEventListener("input", e => { if (e.target.id === "raise") { const l = $("#raiseLabel"); if (l) l.textContent = "+" + won(+e.target.value); } });
$("#app").addEventListener("change", e => { if (e.target.id === "raise") { st.planRaise = +e.target.value; const y = scrollY; render(); scrollTo(0, y); } });
boot();
</script>
</body></html>
